<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Low contrast text</title>
    <style>
      body { background: #ffffff; font: 16px/1.5 sans-serif; }
      #stub { color: #bbbbbb !important; }
    </style>
  </head>
  <body>
    <main>
      <h1>Low contrast text</h1>
      <p id="soft" style="color:#aaaaaa">Soft grey text</p>
      <p id="stub">Stubborn grey text</p>
    </main>
  </body>
</html>
