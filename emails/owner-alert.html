<!-- subject: [Legible] {{subject}} -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Legible alert</title>
</head>
<body style="margin:0;padding:0;background:#f3f4f8;color:#1f2130;font-family:Inter,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f3f4f8;">
<tr><td align="center" style="padding:32px 16px;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;background:#ffffff;border-radius:12px;border:1px solid #e4e6ee;">
<tr><td style="padding:28px 32px 0;">
<table role="presentation" cellpadding="0" cellspacing="0" style="border-bottom:2px solid #1f2130;"><tr>
<td style="padding:0;vertical-align:bottom;"><div style="width:10px;height:22px;border-left:2px solid #1f2130;font-size:0;line-height:0;"><div style="height:4px;"></div><div style="width:10px;height:2px;background:#1f2130;"></div><div style="height:5px;"></div><div style="width:8px;height:2px;background:#796cbf;"></div><div style="height:5px;"></div><div style="width:4px;height:2px;background:#1f2130;"></div></div></td>
<td style="padding:0 0 3px 7px;vertical-align:bottom;font-size:16px;line-height:16px;font-weight:600;color:#1f2130;">Legible</td>
</tr></table>
</td></tr>
<tr><td style="padding:24px 32px 8px;font-size:15px;line-height:1.65;">
<h1 style="margin:0 0 12px;font-size:20px;line-height:1.25;font-weight:600;">{{subject}}</h1>
<p style="margin:0 0 12px;white-space:pre-wrap;">{{message}}</p>
<p style="margin:0 0 12px;"><a href="{{link}}" style="color:#5d5294;">{{link}}</a></p>
</td></tr>
<tr><td style="padding:16px 32px 28px;font-size:12px;line-height:1.6;color:#5c5f70;border-top:1px solid #eceef4;">
Automatic alert from your Legible site.
</td></tr>
</table>
</td></tr>
</table>
</body>
</html>
